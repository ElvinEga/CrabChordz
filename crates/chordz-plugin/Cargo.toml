[package]
name = "chordz-mac"
description = "A macOS VST3/CLAP port of the CodeFN42 Chordz MIDI chord generator"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
chordz-core = { path = "../chordz-core" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", features = ["vst3"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
